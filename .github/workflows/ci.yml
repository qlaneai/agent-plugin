name: CI
on: [push, pull_request]

permissions:
  contents: read

# A same-repo PR fires both `push` and `pull_request`, so without this the suite
# runs twice per commit. Keyed on `head_ref || ref_name` deliberately, NOT on
# `github.ref`: on a pull_request that is `refs/pull/N/merge` while the push event
# carries `refs/heads/<branch>`, so the two would land in different groups and
# nothing would dedupe. `head_ref` (PR: `<branch>`) and `ref_name` (push:
# `<branch>`) are the pair that actually collide.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
